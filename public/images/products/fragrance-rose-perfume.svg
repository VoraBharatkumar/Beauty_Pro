<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
    <defs>
      <linearGradient id="bg-fragrance-rose-perfume" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FAFAFA" />
    <stop offset="50%" stop-color="#F5F5F5" />
    <stop offset="100%" stop-color="#EBEBEB" />
  </linearGradient>
      <linearGradient id="bottle-fragrance-rose-perfume" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFF8F0" />
    <stop offset="15%" stop-color="#FFFFFF" />
    <stop offset="30%" stop-color="#FFF8F0" />
    <stop offset="70%" stop-color="#e6dfd7" />
    <stop offset="100%" stop-color="#ccc5bd" />
  </linearGradient>
      <linearGradient id="cap-fragrance-rose-perfume" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#885928" />
    <stop offset="25%" stop-color="#facb9a" />
    <stop offset="50%" stop-color="#fff2c1" />
    <stop offset="75%" stop-color="#facb9a" />
    <stop offset="100%" stop-color="#885928" />
  </linearGradient>
      <linearGradient id="reflection-fragrance-rose-perfume" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
      <filter id="shadow-fragrance-rose-perfume" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
      </filter>
      <radialGradient id="light-fragrance-rose-perfume" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg-fragrance-rose-perfume)" rx="24"/>
    
    <!-- Subtle decorative elements -->
    <circle cx="80" cy="80" r="40" fill="#D4A574" opacity="0.05"/>
    <circle cx="340" cy="420" r="50" fill="#D4A574" opacity="0.05"/>
    
    <!-- Product with realistic shadow -->
    <g filter="url(#shadow-fragrance-rose-perfume)">
      
        <!-- Bottle body - elegant shape with glass effect -->
        <path d="M160 280 L160 180 Q160 160 180 160 L220 160 Q240 160 240 180 L240 280 Q240 300 220 300 L180 300 Q160 300 160 280 Z" fill="url(#bottle-fragrance-rose-perfume)" stroke="#D4A574" stroke-width="0.5"/>
        <!-- Liquid inside with gradient -->
        <path d="M165 250 L165 185 Q165 170 180 170 L220 170 Q235 170 235 185 L235 250 Q235 265 220 265 L180 265 Q165 265 165 250 Z" fill="#D4A574" opacity="0.3"/>
        <!-- Bottle neck -->
        <rect x="190" y="120" width="20" height="45" rx="3" fill="url(#bottle-fragrance-rose-perfume)" stroke="#D4A574" stroke-width="0.5"/>
        <!-- Cap with metallic finish -->
        <rect x="185" y="100" width="30" height="25" rx="5" fill="url(#cap-fragrance-rose-perfume)"/>
        <!-- Glass reflection -->
        <path d="M170 180 L170 250 Q170 260 180 260 L180 180 Q180 170 170 180 Z" fill="url(#reflection-fragrance-rose-perfume)"/>
      
    </g>
    
    <!-- Professional lighting overlay -->
    <rect width="400" height="500" fill="url(#light-fragrance-rose-perfume)" rx="24"/>
    
    <!-- Product details/label text -->
    
        <text x="200" y="230" font-family="Georgia,serif" font-size="11" fill="#8B6914" text-anchor="middle" font-weight="600">Rose Intense</text>
        <text x="200" y="280" font-family="Arial,sans-serif" font-size="9" fill="#D4A574" text-anchor="middle">Beauty_Pro</text>
      
    
    <!-- Subtle brand signature -->
    <text x="200" y="420" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" opacity="0.3" font-weight="300">Beauty_Pro</text>
  </svg>