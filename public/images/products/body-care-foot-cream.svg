<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
    <defs>
      <linearGradient id="bg-body-care-foot-cream" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FAFAFA" />
    <stop offset="50%" stop-color="#F5F5F5" />
    <stop offset="100%" stop-color="#EBEBEB" />
  </linearGradient>
      <linearGradient id="bottle-body-care-foot-cream" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#F8F4F0" />
    <stop offset="15%" stop-color="#FFFFFF" />
    <stop offset="30%" stop-color="#F8F4F0" />
    <stop offset="70%" stop-color="#dfdbd7" />
    <stop offset="100%" stop-color="#c5c1bd" />
  </linearGradient>
      <linearGradient id="cap-body-care-foot-cream" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#785c36" />
    <stop offset="25%" stop-color="#eacea8" />
    <stop offset="50%" stop-color="#fff5cf" />
    <stop offset="75%" stop-color="#eacea8" />
    <stop offset="100%" stop-color="#785c36" />
  </linearGradient>
      <linearGradient id="reflection-body-care-foot-cream" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
      <filter id="shadow-body-care-foot-cream" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
      </filter>
      <radialGradient id="light-body-care-foot-cream" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg-body-care-foot-cream)" rx="24"/>
    
    <!-- Subtle decorative elements -->
    <circle cx="80" cy="80" r="40" fill="#C4A882" opacity="0.05"/>
    <circle cx="340" cy="420" r="50" fill="#C4A882" opacity="0.05"/>
    
    <!-- Product with realistic shadow -->
    <g filter="url(#shadow-body-care-foot-cream)">
      
        <!-- Tube body with squeeze effect -->
        <rect x="150" y="180" width="100" height="150" rx="10" fill="url(#bottle-body-care-foot-cream)" stroke="#C4A882" stroke-width="0.5"/>
        <!-- Tube cap with metallic finish -->
        <rect x="185" y="150" width="30" height="35" rx="5" fill="url(#cap-body-care-foot-cream)"/>
        <!-- Label -->
        <rect x="155" y="200" width="90" height="110" rx="5" fill="#FFFFFF" opacity="0.95"/>
        <rect x="160" y="210" width="80" height="1" fill="#C4A882" opacity="0.4"/>
        <rect x="160" y="295" width="80" height="1" fill="#C4A882" opacity="0.4"/>
        <!-- Tube highlight -->
        <rect x="155" y="185" width="15" height="140" rx="7" fill="url(#reflection-body-care-foot-cream)"/>
      
    </g>
    
    <!-- Professional lighting overlay -->
    <rect width="400" height="500" fill="url(#light-body-care-foot-cream)" rx="24"/>
    
    <!-- Product details/label text -->
    
        <text x="200" y="255" font-family="Georgia,serif" font-size="12" fill="#7A6652" text-anchor="middle" font-weight="600">Cooling Foot</text>
        <text x="200" y="275" font-family="Arial,sans-serif" font-size="9" fill="#C4A882" text-anchor="middle">Beauty_Pro</text>
      
    
    <!-- Subtle brand signature -->
    <text x="200" y="420" font-family="Georgia,serif" font-size="12" fill="#7A6652" text-anchor="middle" opacity="0.3" font-weight="300">Beauty_Pro</text>
  </svg>