<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
    <defs>
      <linearGradient id="bg-fragrance-candle" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FAFAFA" />
    <stop offset="50%" stop-color="#F5F5F5" />
    <stop offset="100%" stop-color="#EBEBEB" />
  </linearGradient>
      <linearGradient id="bottle-fragrance-candle" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFF8F0" />
    <stop offset="15%" stop-color="#FFFFFF" />
    <stop offset="30%" stop-color="#FFF8F0" />
    <stop offset="70%" stop-color="#e6dfd7" />
    <stop offset="100%" stop-color="#ccc5bd" />
  </linearGradient>
      <linearGradient id="cap-fragrance-candle" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#885928" />
    <stop offset="25%" stop-color="#facb9a" />
    <stop offset="50%" stop-color="#fff2c1" />
    <stop offset="75%" stop-color="#facb9a" />
    <stop offset="100%" stop-color="#885928" />
  </linearGradient>
      <linearGradient id="reflection-fragrance-candle" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
      <filter id="shadow-fragrance-candle" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
      </filter>
      <radialGradient id="light-fragrance-candle" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg-fragrance-candle)" rx="24"/>
    
    <!-- Subtle decorative elements -->
    <circle cx="80" cy="80" r="40" fill="#D4A574" opacity="0.05"/>
    <circle cx="340" cy="420" r="50" fill="#D4A574" opacity="0.05"/>
    
    <!-- Product with realistic shadow -->
    <g filter="url(#shadow-fragrance-candle)">
      
        <!-- Candle jar with glass effect -->
        <rect x="155" y="180" width="90" height="120" rx="10" fill="url(#bottle-fragrance-candle)" stroke="#D4A574" stroke-width="0.5"/>
        <!-- Candle wax with texture -->
        <rect x="160" y="200" width="80" height="80" rx="5" fill="#FFFDF7"/>
        <rect x="160" y="200" width="80" height="20" rx="5" fill="#D4A574" opacity="0.1"/>
        <!-- Wick -->
        <rect x="197" y="190" width="6" height="15" fill="#8B6914"/>
        <!-- Flame with glow -->
        <ellipse cx="200" cy="185" rx="12" ry="16" fill="#FFA500" opacity="0.3"/>
        <ellipse cx="200" cy="185" rx="8" ry="12" fill="#FFA500" opacity="0.8"/>
        <ellipse cx="200" cy="183" rx="5" ry="8" fill="#FFD700"/>
        <!-- Lid with metallic finish -->
        <rect x="150" y="170" width="100" height="15" rx="5" fill="url(#cap-fragrance-candle)"/>
        <!-- Glass reflection -->
        <rect x="160" y="185" width="20" height="110" rx="10" fill="url(#reflection-fragrance-candle)"/>
      
    </g>
    
    <!-- Professional lighting overlay -->
    <rect width="400" height="500" fill="url(#light-fragrance-candle)" rx="24"/>
    
    <!-- Product details/label text -->
    
        <text x="200" y="265" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" font-weight="600">Rose Gold</text>
        <text x="200" y="285" font-family="Arial,sans-serif" font-size="9" fill="#D4A574" text-anchor="middle">Beauty_Pro</text>
      
    
    <!-- Subtle brand signature -->
    <text x="200" y="420" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" opacity="0.3" font-weight="300">Beauty_Pro</text>
  </svg>