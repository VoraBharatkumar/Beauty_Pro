<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
    <defs>
      <linearGradient id="bg-haircare-mask" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FAFAFA" />
    <stop offset="50%" stop-color="#F5F5F5" />
    <stop offset="100%" stop-color="#EBEBEB" />
  </linearGradient>
      <linearGradient id="bottle-haircare-mask" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FAF7F2" />
    <stop offset="15%" stop-color="#FFFFFF" />
    <stop offset="30%" stop-color="#FAF7F2" />
    <stop offset="70%" stop-color="#e1ded9" />
    <stop offset="100%" stop-color="#c7c4bf" />
  </linearGradient>
      <linearGradient id="cap-haircare-mask" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#6c4922" />
    <stop offset="25%" stop-color="#debb94" />
    <stop offset="50%" stop-color="#ffe2bb" />
    <stop offset="75%" stop-color="#debb94" />
    <stop offset="100%" stop-color="#6c4922" />
  </linearGradient>
      <linearGradient id="reflection-haircare-mask" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
      <filter id="shadow-haircare-mask" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
      </filter>
      <radialGradient id="light-haircare-mask" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg-haircare-mask)" rx="24"/>
    
    <!-- Subtle decorative elements -->
    <circle cx="80" cy="80" r="40" fill="#B8956E" opacity="0.05"/>
    <circle cx="340" cy="420" r="50" fill="#B8956E" opacity="0.05"/>
    
    <!-- Product with realistic shadow -->
    <g filter="url(#shadow-haircare-mask)">
      
        <!-- Tube body with squeeze effect -->
        <rect x="150" y="180" width="100" height="150" rx="10" fill="url(#bottle-haircare-mask)" stroke="#B8956E" stroke-width="0.5"/>
        <!-- Tube cap with metallic finish -->
        <rect x="185" y="150" width="30" height="35" rx="5" fill="url(#cap-haircare-mask)"/>
        <!-- Label -->
        <rect x="155" y="200" width="90" height="110" rx="5" fill="#FFFFFF" opacity="0.95"/>
        <rect x="160" y="210" width="80" height="1" fill="#B8956E" opacity="0.4"/>
        <rect x="160" y="295" width="80" height="1" fill="#B8956E" opacity="0.4"/>
        <!-- Tube highlight -->
        <rect x="155" y="185" width="15" height="140" rx="7" fill="url(#reflection-haircare-mask)"/>
      
    </g>
    
    <!-- Professional lighting overlay -->
    <rect width="400" height="500" fill="url(#light-haircare-mask)" rx="24"/>
    
    <!-- Product details/label text -->
    
        <text x="200" y="255" font-family="Georgia,serif" font-size="12" fill="#6B5744" text-anchor="middle" font-weight="600">Deep Nourish</text>
        <text x="200" y="275" font-family="Arial,sans-serif" font-size="9" fill="#B8956E" text-anchor="middle">Beauty_Pro</text>
      
    
    <!-- Subtle brand signature -->
    <text x="200" y="420" font-family="Georgia,serif" font-size="12" fill="#6B5744" text-anchor="middle" opacity="0.3" font-weight="300">Beauty_Pro</text>
  </svg>