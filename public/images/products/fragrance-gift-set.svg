<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
    <defs>
      <linearGradient id="bg-fragrance-gift-set" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FAFAFA" />
    <stop offset="50%" stop-color="#F5F5F5" />
    <stop offset="100%" stop-color="#EBEBEB" />
  </linearGradient>
      <linearGradient id="bottle-fragrance-gift-set" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFF8F0" />
    <stop offset="15%" stop-color="#FFFFFF" />
    <stop offset="30%" stop-color="#FFF8F0" />
    <stop offset="70%" stop-color="#e6dfd7" />
    <stop offset="100%" stop-color="#ccc5bd" />
  </linearGradient>
      <linearGradient id="cap-fragrance-gift-set" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#885928" />
    <stop offset="25%" stop-color="#facb9a" />
    <stop offset="50%" stop-color="#fff2c1" />
    <stop offset="75%" stop-color="#facb9a" />
    <stop offset="100%" stop-color="#885928" />
  </linearGradient>
      <linearGradient id="reflection-fragrance-gift-set" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
      <filter id="shadow-fragrance-gift-set" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
      </filter>
      <radialGradient id="light-fragrance-gift-set" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg-fragrance-gift-set)" rx="24"/>
    
    <!-- Subtle decorative elements -->
    <circle cx="80" cy="80" r="40" fill="#D4A574" opacity="0.05"/>
    <circle cx="340" cy="420" r="50" fill="#D4A574" opacity="0.05"/>
    
    <!-- Product with realistic shadow -->
    <g filter="url(#shadow-fragrance-gift-set)">
      
        <!-- Gift box with premium finish -->
        <rect x="150" y="190" width="100" height="90" rx="5" fill="url(#cap-fragrance-gift-set)" stroke="#D4A574" stroke-width="1"/>
        <!-- Box lid -->
        <rect x="145" y="180" width="110" height="15" rx="3" fill="url(#bottle-fragrance-gift-set)" stroke="#D4A574" stroke-width="0.5"/>
        <!-- Ribbon vertical with shine -->
        <rect x="195" y="185" width="10" height="95" fill="#D4A574"/>
        <rect x="196" y="185" width="3" height="95" fill="#fff2c1" opacity="0.6"/>
        <!-- Ribbon horizontal with shine -->
        <rect x="150" y="225" width="100" height="10" fill="#D4A574"/>
        <rect x="150" y="226" width="100" height="3" fill="#fff2c1" opacity="0.6"/>
        <!-- Bow with 3D effect -->
        <circle cx="200" cy="180" r="10" fill="#D4A574"/>
        <circle cx="185" cy="175" r="8" fill="#D4A574" opacity="0.9"/>
        <circle cx="215" cy="175" r="8" fill="#D4A574" opacity="0.9"/>
        <circle cx="200" cy="178" r="4" fill="#ffd8a7"/>
        <!-- Box highlight -->
        <rect x="155" y="195" width="30" height="80" rx="3" fill="url(#reflection-fragrance-gift-set)"/>
      
    </g>
    
    <!-- Professional lighting overlay -->
    <rect width="400" height="500" fill="url(#light-fragrance-gift-set)" rx="24"/>
    
    <!-- Product details/label text -->
    
        <text x="200" y="310" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" font-weight="600">Luxury Gift</text>
        <text x="200" y="330" font-family="Arial,sans-serif" font-size="9" fill="#D4A574" text-anchor="middle">Beauty_Pro</text>
      
    
    <!-- Subtle brand signature -->
    <text x="200" y="420" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" opacity="0.3" font-weight="300">Beauty_Pro</text>
  </svg>