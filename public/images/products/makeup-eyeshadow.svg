<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
    <defs>
      <linearGradient id="bg-makeup-eyeshadow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FAFAFA" />
    <stop offset="50%" stop-color="#F5F5F5" />
    <stop offset="100%" stop-color="#EBEBEB" />
  </linearGradient>
      <linearGradient id="bottle-makeup-eyeshadow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" />
    <stop offset="15%" stop-color="#FFFFFF" />
    <stop offset="30%" stop-color="#FFFFFF" />
    <stop offset="70%" stop-color="#e6e6e6" />
    <stop offset="100%" stop-color="#cccccc" />
  </linearGradient>
      <linearGradient id="cap-makeup-eyeshadow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#885959" />
    <stop offset="25%" stop-color="#facbcb" />
    <stop offset="50%" stop-color="#fff2f2" />
    <stop offset="75%" stop-color="#facbcb" />
    <stop offset="100%" stop-color="#885959" />
  </linearGradient>
      <linearGradient id="reflection-makeup-eyeshadow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
      <filter id="shadow-makeup-eyeshadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
      </filter>
      <radialGradient id="light-makeup-eyeshadow" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg-makeup-eyeshadow)" rx="24"/>
    
    <!-- Subtle decorative elements -->
    <circle cx="80" cy="80" r="40" fill="#D4A5A5" opacity="0.05"/>
    <circle cx="340" cy="420" r="50" fill="#D4A5A5" opacity="0.05"/>
    
    <!-- Product with realistic shadow -->
    <g filter="url(#shadow-makeup-eyeshadow)">
      
        <!-- Palette case with premium finish -->
        <rect x="140" y="160" width="120" height="100" rx="10" fill="url(#cap-makeup-eyeshadow)" stroke="#D4A5A5" stroke-width="1"/>
        <!-- Palette lid -->
        <rect x="140" y="160" width="120" height="100" rx="10" fill="url(#bottle-makeup-eyeshadow)" opacity="0.9"/>
        <!-- Mirror with reflection -->
        <rect x="150" y="170" width="100" height="80" rx="5" fill="#E8E8E8" opacity="0.6"/>
        <rect x="150" y="170" width="100" height="40" rx="5" fill="#FFFFFF" opacity="0.3"/>
        <!-- Eyeshadow pans with realistic colors -->
        <circle cx="175" cy="220" r="15" fill="#D4A5A5" opacity="0.8"/>
        <circle cx="175" cy="220" r="12" fill="#ffd8d8" opacity="0.4"/>
        <circle cx="215" cy="220" r="15" fill="#8B6F6F" opacity="0.7"/>
        <circle cx="195" cy="245" r="12" fill="#F8BBD0" opacity="0.8"/>
        <!-- Case highlight -->
        <rect x="145" y="165" width="30" height="90" rx="5" fill="url(#reflection-makeup-eyeshadow)"/>
      
    </g>
    
    <!-- Professional lighting overlay -->
    <rect width="400" height="500" fill="url(#light-makeup-eyeshadow)" rx="24"/>
    
    <!-- Product details/label text -->
    
        <text x="200" y="290" font-family="Georgia,serif" font-size="12" fill="#8B6F6F" text-anchor="middle" font-weight="600">Smoky Eye</text>
        <text x="200" y="310" font-family="Arial,sans-serif" font-size="9" fill="#D4A5A5" text-anchor="middle">Beauty_Pro</text>
      
    
    <!-- Subtle brand signature -->
    <text x="200" y="420" font-family="Georgia,serif" font-size="12" fill="#8B6F6F" text-anchor="middle" opacity="0.3" font-weight="300">Beauty_Pro</text>
  </svg>