<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
    <defs>
      <linearGradient id="bg-makeup-brow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FAFAFA" />
    <stop offset="50%" stop-color="#F5F5F5" />
    <stop offset="100%" stop-color="#EBEBEB" />
  </linearGradient>
      <linearGradient id="bottle-makeup-brow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" />
    <stop offset="15%" stop-color="#FFFFFF" />
    <stop offset="30%" stop-color="#FFFFFF" />
    <stop offset="70%" stop-color="#e6e6e6" />
    <stop offset="100%" stop-color="#cccccc" />
  </linearGradient>
      <linearGradient id="cap-makeup-brow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#885959" />
    <stop offset="25%" stop-color="#facbcb" />
    <stop offset="50%" stop-color="#fff2f2" />
    <stop offset="75%" stop-color="#facbcb" />
    <stop offset="100%" stop-color="#885959" />
  </linearGradient>
      <linearGradient id="reflection-makeup-brow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
      <filter id="shadow-makeup-brow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
      </filter>
      <radialGradient id="light-makeup-brow" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg-makeup-brow)" rx="24"/>
    
    <!-- Subtle decorative elements -->
    <circle cx="80" cy="80" r="40" fill="#D4A5A5" opacity="0.05"/>
    <circle cx="340" cy="420" r="50" fill="#D4A5A5" opacity="0.05"/>
    
    <!-- Product with realistic shadow -->
    <g filter="url(#shadow-makeup-brow)">
      
        <!-- Brow pencil with premium finish -->
        <rect x="190" y="140" width="20" height="180" rx="3" fill="#FFFFFF" stroke="#D4A5A5" stroke-width="0.5"/>
        <!-- Pencil tip with sharpened effect -->
        <path d="M192 140 L200 110 L208 140 Z" fill="#8B6F6F"/>
        <path d="M194 140 L200 120 L206 140 Z" fill="#bea2a2" opacity="0.5"/>
        <!-- Cap with metallic finish -->
        <rect x="188" y="105" width="24" height="15" rx="3" fill="url(#cap-makeup-brow)"/>
        <!-- Pencil highlight -->
        <rect x="193" y="145" width="4" height="170" rx="2" fill="url(#reflection-makeup-brow)"/>
      
    </g>
    
    <!-- Professional lighting overlay -->
    <rect width="400" height="500" fill="url(#light-makeup-brow)" rx="24"/>
    
    <!-- Product details/label text -->
    
        <text x="200" y="250" font-family="Georgia,serif" font-size="12" fill="#8B6F6F" text-anchor="middle" font-weight="600">Precision Brow</text>
        <text x="200" y="270" font-family="Arial,sans-serif" font-size="9" fill="#D4A5A5" text-anchor="middle">Beauty_Pro</text>
      
    
    <!-- Subtle brand signature -->
    <text x="200" y="420" font-family="Georgia,serif" font-size="12" fill="#8B6F6F" text-anchor="middle" opacity="0.3" font-weight="300">Beauty_Pro</text>
  </svg>