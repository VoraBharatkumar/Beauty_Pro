<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
    <defs>
      <linearGradient id="bg-fragrance-oud-oil" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FAFAFA" />
    <stop offset="50%" stop-color="#F5F5F5" />
    <stop offset="100%" stop-color="#EBEBEB" />
  </linearGradient>
      <linearGradient id="bottle-fragrance-oud-oil" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFF8F0" />
    <stop offset="15%" stop-color="#FFFFFF" />
    <stop offset="30%" stop-color="#FFF8F0" />
    <stop offset="70%" stop-color="#e6dfd7" />
    <stop offset="100%" stop-color="#ccc5bd" />
  </linearGradient>
      <linearGradient id="cap-fragrance-oud-oil" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#885928" />
    <stop offset="25%" stop-color="#facb9a" />
    <stop offset="50%" stop-color="#fff2c1" />
    <stop offset="75%" stop-color="#facb9a" />
    <stop offset="100%" stop-color="#885928" />
  </linearGradient>
      <linearGradient id="reflection-fragrance-oud-oil" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
      <filter id="shadow-fragrance-oud-oil" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
      </filter>
      <radialGradient id="light-fragrance-oud-oil" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg-fragrance-oud-oil)" rx="24"/>
    
    <!-- Subtle decorative elements -->
    <circle cx="80" cy="80" r="40" fill="#D4A574" opacity="0.05"/>
    <circle cx="340" cy="420" r="50" fill="#D4A574" opacity="0.05"/>
    
    <!-- Product with realistic shadow -->
    <g filter="url(#shadow-fragrance-oud-oil)">
      
        <!-- Roll-on bottle with glass effect -->
        <rect x="175" y="180" width="50" height="130" rx="25" fill="url(#bottle-fragrance-oud-oil)" stroke="#D4A574" stroke-width="0.5"/>
        <!-- Liquid inside -->
        <rect x="180" y="230" width="40" height="75" rx="20" fill="#D4A574" opacity="0.2"/>
        <!-- Roller ball with metallic finish -->
        <circle cx="200" cy="165" r="12" fill="#8B6914" opacity="0.4"/>
        <circle cx="200" cy="165" r="8" fill="#D4A574" opacity="0.7"/>
        <circle cx="198" cy="163" r="3" fill="#FFFFFF" opacity="0.5"/>
        <!-- Cap with metallic finish -->
        <rect x="180" y="140" width="40" height="30" rx="8" fill="url(#cap-fragrance-oud-oil)"/>
        <!-- Glass reflection -->
        <rect x="178" y="185" width="12" height="120" rx="6" fill="url(#reflection-fragrance-oud-oil)"/>
      
    </g>
    
    <!-- Professional lighting overlay -->
    <rect width="400" height="500" fill="url(#light-fragrance-oud-oil)" rx="24"/>
    
    <!-- Product details/label text -->
    
        <text x="200" y="250" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" font-weight="600">Premium Oud</text>
        <text x="200" y="270" font-family="Arial,sans-serif" font-size="9" fill="#D4A574" text-anchor="middle">Beauty_Pro</text>
      
    
    <!-- Subtle brand signature -->
    <text x="200" y="420" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" opacity="0.3" font-weight="300">Beauty_Pro</text>
  </svg>